name: photo_organizer
description: Offline Photo Organizer & Chatbot for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  get_it: ^7.6.7
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5

  # Database
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # ML / AI
  tflite_flutter: ^0.10.4
  image: ^4.1.7

  # Image handling
  image_picker: ^1.0.7
  photo_manager: ^3.1.0
  permission_handler: ^11.3.0
  gallery_saver: ^2.3.2

  # UI
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.0.2+1
  file_picker: ^8.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/